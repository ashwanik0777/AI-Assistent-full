[tool.poetry]
name = "aira"
version = "0.1.0"
description = "AIRA - Artificial Intelligent Responsive Assistant"
authors = ["AIRA Systems Engineering Team"]
readme = "README.md"
packages = [{include = "aira", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
typer = "^0.12.0"
rich = "^13.8.0"
structlog = "^24.4.0"
platformdirs = "^4.2.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
